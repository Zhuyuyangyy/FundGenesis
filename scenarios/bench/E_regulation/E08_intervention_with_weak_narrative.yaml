  mode: strong
  force_strong_at_step: 30
  monitor_threshold: 0.15
  human_review_threshold: 0.25
  block_threshold: 0.60

narratives:
  - step: 25
    name: "Weak positive narrative"
    category: fintech
    polarity: positive
    intensity: 0.30
    credibility: 0.40
  - step: 35
    name: "Weak influencer mention"
    category: sentiment
    polarity: positive
    intensity: 0.30
    credibility: 0.35

expected:
  high_risk_steps_max: 10
