    category: fintech
    polarity: positive
    intensity: 0.88
    credibility: 0.72
  - step: 28
    name: "Influencer amplification"
    category: fintech
    polarity: positive
    intensity: 0.75
    credibility: 0.65
  - step: 33
    name: "Micro KOL cross-tier amplification"
    category: sentiment
    polarity: positive
    intensity: 0.70
    credibility: 0.60
  - step: 45
    name: "Price self-validation event"
    category: earnings
    polarity: positive
    intensity: 0.80
    credibility: 0.70
  - step: 55
    name: "Retail FOMO surge"
    category: sentiment
    polarity: positive
    intensity: 0.85
    credibility: 0.50

expected:
  # 已知限制：light模式下manipulation_risk未达0.30阈值，干预不触发
