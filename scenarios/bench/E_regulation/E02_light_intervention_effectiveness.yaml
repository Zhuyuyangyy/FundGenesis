id: E02
name: light_intervention_effectiveness
description: "Light Intervention — Same narratives as E01 baseline but with light regulation (mode=light). Tests that light intervention reduces risk."
category: regulatory_intervention
steps: 200
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
