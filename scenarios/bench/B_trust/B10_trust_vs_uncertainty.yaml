id: B10
name: trust_vs_uncertainty
description: "Trust vs uncertainty — A positive narrative with high initial uncertainty (initial_uncertainty=0.6). Tests that high uncertainty dampens the trust effect on price."
category: trust_evolution
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.6
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Positive narrative under high uncertainty"
    category: macro
    polarity: positive
    intensity: 0.7
    credibility: 0.8

expected:
  # 高不确定性下正面叙事仍会推动价格上涨（已知限制）
  price_peak_max: 220
