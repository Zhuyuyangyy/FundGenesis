id: F04
name: no_narrative_baseline
description: "No-narrative baseline — Empty narratives list. Tests baseline market behavior without any narrative influence; price should stay near the initial price with just noise."
category: robustness_stress
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives: []

expected:
  # 无叙事时价格仅受噪声驱动，允许小幅漂移
  price_peak_max: 108
