id: F01
name: extreme_noise
description: "Extreme market noise — Very high market noise (noise_std=0.05) with a positive narrative injection. Tests system stability under extreme noise; the narrative effect should still be visible despite the noise."
category: robustness_stress
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.05
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Positive narrative under extreme noise"
    category: fintech
    polarity: positive
    intensity: 0.85
    credibility: 0.75

expected:
  price_peak_min: 102
