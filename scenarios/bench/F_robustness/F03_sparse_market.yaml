id: F03
name: sparse_market
description: "Sparse market — Very few agents (total_agents=20) and a small KOL network (n_macro=1, n_influencer=2, n_micro=3, n_retail=14). Tests that the system runs without crashing and produces minimal movement under a sparse market."
category: robustness_stress
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 20

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 1
  n_influencer: 2
  n_micro: 3
  n_retail: 14

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Positive narrative in a sparse market"
    category: fintech
    polarity: positive
    intensity: 0.7
    credibility: 0.6

expected:
  price_peak_min: 100
