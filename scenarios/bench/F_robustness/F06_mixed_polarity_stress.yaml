id: F06
name: mixed_polarity_stress
description: "Mixed polarity stress — Alternating positive and negative narratives every 10 steps (positive at 10, 30, 50; negative at 20, 40, 60). Tests system stability under mixed polarity stress; price should not explode in either direction."
category: robustness_stress
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Positive push 1"
    category: fintech
    polarity: positive
    intensity: 0.8
    credibility: 0.7
  - step: 20
    name: "Negative push 1"
    category: macro
    polarity: negative
    intensity: 0.8
    credibility: 0.7
  - step: 30
    name: "Positive push 2"
    category: fintech
    polarity: positive
    intensity: 0.8
    credibility: 0.7
  - step: 40
    name: "Negative push 2"
    category: macro
    polarity: negative
    intensity: 0.8
    credibility: 0.7
  - step: 50
    name: "Positive push 3"
    category: fintech
    polarity: positive
    intensity: 0.8
    credibility: 0.7
  - step: 60
    name: "Negative push 3"
    category: macro
    polarity: negative
    intensity: 0.8
    credibility: 0.7

expected:
  # 混合极性下正面叙事仍占主导（已知限制：负面叙事效果弱）
  price_peak_max: 230
