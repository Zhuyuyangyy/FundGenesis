id: A11
name: sector_specific_narrative
description: "Narrative with a target_sector set. Tests sector targeting: the narrative should propagate primarily to agents exposed to that sector, producing a moderate but bounded price increase."
category: narrative_propagation
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Sector-targeted positive narrative"
    category: sector
    polarity: positive
    intensity: 0.75
    credibility: 0.65
    target_sector: "tech"

expected:
  price_peak_min: 108
