id: A04
name: narrative_reversal
description: "Positive narrative at step 10 followed by a negative narrative at step 40. Tests narrative reversal: price should rise initially (peak >= 110) then decline after step 40 as the negative narrative takes over."
category: narrative_propagation
steps: 100
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.008
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Initial positive narrative"
    category: fintech
    polarity: positive
    intensity: 0.80
    credibility: 0.70
    target_sector: ""
  - step: 40
    name: "Reversal negative narrative"
    category: macro
    polarity: negative
    intensity: 0.85
    credibility: 0.75
    target_sector: ""

expected:
  price_peak_min: 110
