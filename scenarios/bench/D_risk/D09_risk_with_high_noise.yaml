id: D09
name: risk_with_high_noise
description: "Strong positive narrative with high market noise (noise_std=0.03). Tests risk detection under noisy conditions: the risk agent should still register manipulation risk despite elevated background noise obscuring the signal."
category: risk_identification
steps: 150
seed: 42

market:
  initial_price: 100.0
  impact_coefficient: 0.5
  noise_std: 0.03
  total_agents: 100

emotion:
  initial_fear: 0.3
  initial_greed: 0.3
  initial_confidence: 0.5
  initial_uncertainty: 0.3
  inertia: 0.90

kol:
  n_macro: 3
  n_influencer: 8
  n_micro: 15
  n_retail: 100

agents:
  value_investor_ratio: 0.10
  trend_follower_ratio: 0.30
  emotional_retail_ratio: 0.60

regulation:
  mode: none

narratives:
  - step: 10
    name: "Strong positive narrative under high noise"
    category: manipulation
    polarity: positive
    intensity: 0.85
    credibility: 0.75
    target_sector: ""

expected:
  manipulation_risk_peak_min: 0.05
